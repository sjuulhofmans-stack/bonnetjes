# Gratis Supabase-projecten worden gepauzeerd na een week zonder gebruik.
# Deze taak doet twee keer per week een klein verzoek, zodat dat niet gebeurt.
# Hij leest de gegevens uit js/config.js; je hoeft hier niets in te stellen.
name: Supabase wakker houden

on:
  schedule:
    - cron: '17 6 * * 1,4'   # maandag en donderdag, 's ochtends
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Klein verzoek naar Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']*" js/config.js || true)
          KEY=$(grep -oP "SUPABASE_ANON_KEY:\s*'\K[^']*" js/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js is nog niet ingevuld, niets te doen."
            exit 0
          fi
          curl -sS -o /dev/null -w "Supabase antwoordde met status %{http_code}\n" \
            "$URL/rest/v1/clients?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
